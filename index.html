<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="stylesheet" href="styles.css?v=3" />
  <!-- Font Awesome for X/Twitter icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <header>
    <img src="media/NameNero.png" alt="Logo" class="site-logo" />
    <nav>
      <a href="#" id="openContact" class="nav-contact">Contact</a>
    </nav>
  </header>

  <main>
    <!-- Dynamic grid loaded via app.js -->
  </main>

  <!-- Media Preview Modal -->
  <div id="modal" class="modal">
    <div class="modal-inner">
      <span id="modalCloseBtn" class="modal-close-btn">&times;</span>
      <div id="modal-media"></div>
      <div id="modal-info" class="modal-info"></div>
    </div>
  </div>

  <!-- Contact Modal -->
  <div id="contactModal" class="contact-modal">
    <div class="contact-modal-content">
      <span id="closeContact" class="contact-close">&times;</span>
      <h2>Contact</h2>
      <p>Hi, im Nero, i have a strong passion for art and animation.</p>
      <p>if you want to send an email please use this email!</p>
      <p><a href="mailto:nerosftt@gmail.com" class="contact-email">nerosftt@gmail.com</a></p>
      <div class="social-links">
        <a href="https://twitter.com/nerosftt" target="_blank" rel="noopener noreferrer" class="social-icon">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>

</html>
